name: offline-tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: >-
          python -m py_compile
          jetson/main.py
          jetson/x3_bridge.py
          jetson/scripts/move_base_cli.py
          jetson/stage1_unit_test.py
          jetson/stage2_unit_test.py
          jetson/x3_bridge_navigation_unit_test.py
          jetson/tests/move_base_cli_unit_test.py
      - name: Stage 1
        run: python jetson/stage1_unit_test.py
      - name: Stage 2
        run: python jetson/stage2_unit_test.py
      - name: Bridge observer
        run: python jetson/x3_bridge_navigation_unit_test.py
      - name: CLI
        run: python jetson/tests/move_base_cli_unit_test.py
