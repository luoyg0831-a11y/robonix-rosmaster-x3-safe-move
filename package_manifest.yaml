manifestVersion: 1

package:
  name: robonix.primitive.yahboom.rosmaster_x3.safe_move
  version: 0.3.0-candidate.1
  description: Guarded ROS1 navigation up to 0.80 m for Yahboom ROSMASTER X3.
  tags: [primitive, chassis, yahboom, rosmaster_x3, ros1, navigation, safety]
  maintainers:
    - luoyg0831 <luoyg0831@gmail.com>
  license: Apache-2.0

build: RBNX_PACKAGE_ROOT=jetson bash jetson/scripts/build.sh
start: RBNX_PACKAGE_ROOT=jetson bash jetson/scripts/start.sh

capabilities:
  - name: robonix/primitive/rosmaster_x3_bridge/get_status
    path: jetson/capabilities/primitive/rosmaster_x3_bridge/get_status.v1.toml
  - name: robonix/primitive/rosmaster_x3_bridge/check_nav_ready
    path: jetson/capabilities/primitive/rosmaster_x3_bridge/check_nav_ready.v1.toml
  - name: robonix/primitive/rosmaster_x3_bridge/preview_safe_waypoint
    path: jetson/capabilities/primitive/rosmaster_x3_bridge/preview_safe_waypoint.v1.toml
  - name: robonix/primitive/rosmaster_x3_bridge/prepare_safe_navigation
    path: jetson/capabilities/primitive/rosmaster_x3_bridge/prepare_safe_navigation.v1.toml
  - name: robonix/primitive/rosmaster_x3_bridge/preview_move_options
    path: jetson/capabilities/primitive/rosmaster_x3_bridge/preview_move_options.v1.toml
  - name: robonix/primitive/rosmaster_x3_bridge/prepare_selected_move
    path: jetson/capabilities/primitive/rosmaster_x3_bridge/prepare_selected_move.v1.toml
  - name: robonix/primitive/rosmaster_x3_bridge/execute_prepared_navigation
    path: jetson/capabilities/primitive/rosmaster_x3_bridge/execute_prepared_navigation.v1.toml
  - name: robonix/primitive/rosmaster_x3_bridge/cancel_nav_goal
    path: jetson/capabilities/primitive/rosmaster_x3_bridge/cancel_nav_goal.v1.toml

depends: []
