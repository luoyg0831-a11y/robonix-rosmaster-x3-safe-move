name: offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax and offline tests
        run: |
          python -m py_compile \
            jetson/main.py \
            jetson/x3_bridge.py \
            jetson/scripts/move_base_cli.py \
            jetson/stage1_unit_test.py \
            jetson/stage2_unit_test.py \
            jetson/x3_bridge_navigation_unit_test.py \
            jetson/tests/move_base_cli_unit_test.py \
            tools/audit_candidate.py \
            tools/audit_catalog_package.py \
            tools/audit_public_snapshot.py
          python jetson/stage1_unit_test.py
          python jetson/stage2_unit_test.py
          python jetson/x3_bridge_navigation_unit_test.py
          python jetson/tests/move_base_cli_unit_test.py
          python tools/audit_candidate.py
          python tools/audit_catalog_package.py
          python tools/audit_public_snapshot.py
      - name: Verify recorded checksums
        run: sha256sum --check SHA256SUMS
