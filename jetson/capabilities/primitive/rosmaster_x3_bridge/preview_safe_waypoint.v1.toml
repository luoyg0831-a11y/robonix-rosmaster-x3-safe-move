id      = "robonix/primitive/rosmaster_x3_bridge/preview_safe_waypoint"
version = "1"
kind    = "primitive"
idl     = "rosmaster_x3_bridge/srv/PreviewSafeWaypoint.srv"

[mode]
type = "rpc"
