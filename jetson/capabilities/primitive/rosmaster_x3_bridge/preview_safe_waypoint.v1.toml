# ROSMASTER X3 read-only nearby safe waypoint preview.
#
# This searches candidate poses using AMCL, the global costmap,
# and /move_base/make_plan.
#
# It must not modify x3_waypoints.json.
# It must not publish /cmd_vel.
# It must not send navigation goals.
